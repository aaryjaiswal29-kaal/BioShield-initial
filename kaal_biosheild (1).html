<style>
:root{
  --bs-dark:#0F172A;
  --bs-green:#0F766E;
  --bs-green-mid:#14B8A6;
  --bs-green-light:#CCFBF1;
  --bs-bg:#F8FAFC;
  --bs-blue:#2563EB;
  --bs-amber:#F59E0B;
  --bs-red:#EF4444;
  --bs-text:#1E293B;
  --bs-grey:#64748B;
  --bs-border:#E2E8F0;
  --bs-ai:#7C3AED;
  --bs-ai-light:#EDE9FE;
  --bs-success:#10B981;
  --bs-success-light:#D1FAE5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bs-bg);color:var(--bs-text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px;}
.card{background:#fff;border:1px solid var(--bs-border);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,0.04);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;padding:10px 18px;border-radius:10px;transition:all .15s ease;cursor:pointer;border:1px solid transparent;white-space:nowrap;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--bs-green);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--bs-dark);}
.btn-outline{background:#fff;color:var(--bs-green);border-color:var(--bs-green);}
.btn-outline:hover:not(:disabled){background:var(--bs-green-light);}
.btn-ghost{background:transparent;color:var(--bs-text);}
.btn-ghost:hover:not(:disabled){background:#F1F5F9;}
.btn-amber{background:var(--bs-amber);color:#fff;}
.btn-red{background:var(--bs-red);color:#fff;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.pill-high{background:#FEE2E2;color:#B91C1C;}
.pill-medium{background:#FEF3C7;color:#92400E;}
.pill-low{background:#D1FAE5;color:#047857;}
.pill-registered{background:#F1F5F9;color:#334155;}
.pill-pending{background:#FEF3C7;color:#92400E;}
.pill-assigned{background:#DBEAFE;color:#1D4ED8;}
.pill-transit{background:#CCFBF1;color:#0F766E;}
.pill-arrived{background:#BFDBFE;color:#1E3A8A;}
.pill-verified{background:#D1FAE5;color:#047857;}
.sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:#CBD5E1;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;}
.sidebar-link:hover{background:rgba(255,255,255,0.08);}
.sidebar-link.active{background:var(--bs-green-mid);color:#fff;}
.sidebar-link.alert-link{color:#fcd9a0;font-weight:600;}
.sidebar-link.alert-link:hover{background:rgba(217,119,6,0.18);}
.sidebar-link.alert-link.active{background:var(--bs-amber);color:#20140a;}
.alert-badge{margin-left:auto;background:var(--bs-amber);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.sidebar-link.alert-link.active .alert-badge{background:#fff;color:var(--bs-amber);}
.alert-card{background:#fffaf0;border:1px solid #fbd38d;border-left:4px solid var(--bs-amber);border-radius:12px;}
.pill-critical{background:#fee2e2;color:#991b1b;}
.pill-resolved{background:#f0fdf4;color:#166534;}
.input{width:100%;padding:10px 12px;border:1px solid var(--bs-border);border-radius:10px;font-size:14px;background:#fff;color:var(--bs-text);}
.input:focus{outline:none;border-color:var(--bs-green-mid);box-shadow:0 0 0 3px rgba(20,184,166,0.15);}
.label{font-size:12.5px;font-weight:600;color:var(--bs-grey);margin-bottom:6px;display:block;}
.step-dot{width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.fade-in{animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--bs-grey);padding:10px 14px;border-bottom:1px solid var(--bs-border);white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid #F1F5F9;white-space:nowrap;}
tr:hover td{background:#F8FAFC;}
.map-box{position:relative;background:linear-gradient(135deg,#CCFBF1,#E0F2FE);border-radius:14px;height:220px;overflow:hidden;border:1px solid var(--bs-border);}
.map-dot{position:absolute;width:14px;height:14px;border-radius:999px;border:3px solid #fff;box-shadow:0 0 0 3px rgba(0,0,0,.06);}
.demo-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--bs-amber);background:#FFFBEB;border:1px solid #FDE68A;padding:4px 10px;border-radius:999px;}
.checklist-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--bs-border);border-radius:10px;cursor:pointer;background:#fff;}
.checklist-item.checked{background:var(--bs-green-light);border-color:var(--bs-green-mid);}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.toast{position:fixed;bottom:20px;right:20px;background:#0F172A;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:200;display:flex;align-items:center;gap:8px;}
@media(max-width:1023px){
  .desktop-sidebar{display:none !important;}
}
@media(min-width:1024px){
  .mobile-only{display:none !important;}
}
.brand-text{
  font-weight:800;
  letter-spacing:-0.01em;
  background:linear-gradient(90deg,var(--bs-dark) 0%,var(--bs-green) 55%,var(--bs-green-mid) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  display:inline-block;
}
.brand-text-light{
  font-weight:800;
  letter-spacing:-0.01em;
  background:linear-gradient(90deg,#ffffff 0%,#99F6E4 65%,#2DD4BF 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  display:inline-block;
}
/* ---------- Admin GPS fleet tracking ---------- */
.gps-layout{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:1280px){.gps-layout{grid-template-columns:272px minmax(0,1fr) 300px;}}
@media(min-width:900px) and (max-width:1279px){.gps-layout{grid-template-columns:272px minmax(0,1fr);}}
.gps-stat{background:#fff;border:1px solid var(--bs-border);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,0.04);padding:14px 15px;}
.gps-stat .gps-stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.gps-stat .gps-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.gps-stat .gps-val{font-size:26px;font-weight:800;color:var(--bs-dark);line-height:1;letter-spacing:-.5px;}
.gps-stat .gps-lab{font-size:12.5px;font-weight:600;color:var(--bs-text);margin-top:7px;}
.gps-stat .gps-sub{font-size:11px;color:var(--bs-grey);margin-top:2px;}
.gps-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:999px;}
.gps-veh{width:100%;text-align:left;border:1px solid var(--bs-border);border-radius:12px;padding:10px 11px;background:#fff;cursor:pointer;transition:all .15s ease;border-left-width:3px;}
.gps-veh:hover{background:#F8FAFC;border-color:#CBD5E1;}
.gps-veh.is-active{background:var(--bs-green-light);border-color:var(--bs-green-mid);box-shadow:0 0 0 3px rgba(20,184,166,.15);}
.gps-veh:focus-visible{outline:2px solid var(--bs-green-mid);outline-offset:2px;}
.gps-veh-id{font-size:13.5px;font-weight:800;color:var(--bs-dark);}
.gps-veh-meta{font-size:11px;color:var(--bs-grey);}
.gps-sdot{width:8px;height:8px;border-radius:999px;flex-shrink:0;}
.gps-list{max-height:520px;overflow-y:auto;padding-right:3px;}
.gps-chip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--bs-border);background:#fff;color:var(--bs-grey);cursor:pointer;transition:all .15s ease;white-space:nowrap;}
.gps-chip:hover{border-color:#CBD5E1;color:var(--bs-text);}
.gps-chip.is-on{background:var(--bs-green);border-color:var(--bs-green);color:#fff;}
.gps-map-frame{position:relative;width:100%;aspect-ratio:1376/768;overflow:hidden;border-radius:12px;border:1px solid var(--bs-border);background:#EEF2F6;}
.gps-map-canvas{position:absolute;inset:0;transition:transform .55s cubic-bezier(.4,0,.2,1);}
.gps-map-canvas img{width:100%;height:100%;display:block;object-fit:cover;}
.gps-marker{position:absolute;transform:translate(-50%,-50%);pointer-events:none;}
.gps-marker .gps-ring{width:15px;height:15px;border-radius:999px;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(15,23,42,.45);}
.gps-marker.is-sel .gps-ring{width:21px;height:21px;border-width:3px;box-shadow:0 0 0 4px rgba(255,255,255,.55),0 2px 8px rgba(15,23,42,.5);}
.gps-marker.is-sel::after{content:"";position:absolute;left:50%;top:50%;width:21px;height:21px;margin:-10.5px 0 0 -10.5px;border-radius:999px;border:2px solid currentColor;animation:gpsPulse 1.8s ease-out infinite;}
.gps-marker .gps-tagid{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);font-size:10.5px;font-weight:800;color:#fff;background:rgba(15,23,42,.88);padding:2px 7px;border-radius:6px;white-space:nowrap;}
@keyframes gpsPulse{0%{transform:scale(1);opacity:.85}100%{transform:scale(3.1);opacity:0}}
@media(prefers-reduced-motion:reduce){.gps-marker.is-sel::after{animation:none;opacity:0}.gps-map-canvas{transition:none}}
.gps-field{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bs-border);}
.gps-field:last-child{border-bottom:none;}
.gps-field .k{font-size:11.5px;color:var(--bs-grey);font-weight:600;flex-shrink:0;}
.gps-field .v{font-size:12.5px;color:var(--bs-text);font-weight:700;text-align:right;}
.gps-prog{height:6px;border-radius:999px;background:#E2E8F0;overflow:hidden;}
.gps-prog span{display:block;height:100%;border-radius:999px;background:var(--bs-green-mid);}

/* ===================== DARK MODE ===================== */
html.dark{
  --bs-dark:#0B1220; /* still used as a background */
  --bs-green:#2DD4BF;
  --bs-green-mid:#14B8A6;
  --bs-green-light:#134E4A;
  --bs-bg:#0B1220;
  --bs-blue:#60A5FA;
  --bs-amber:#FBBF24;
  --bs-red:#F87171;
  --bs-text:#E2E8F0;
  --bs-grey:#94A3B8;
  --bs-border:#26324A;
  --bs-ai:#A78BFA;
  --bs-ai-light:#2A2145;
  --bs-success:#34D399;
  --bs-success-light:#0F3B2E;
  --bs-surface:#111C31;
  --bs-surface-2:#16233B;
  color-scheme:dark;
}
html.dark body{background:var(--bs-bg);color:var(--bs-text);}
html.dark .card{background:var(--bs-surface);border-color:var(--bs-border);box-shadow:0 1px 2px rgba(0,0,0,.5);}
html.dark .btn-primary{background:var(--bs-green-mid);color:#06231f;}
html.dark .btn-primary:hover:not(:disabled){background:#5EEAD4;}
html.dark .btn-outline{background:transparent;color:var(--bs-green);border-color:var(--bs-green);}
html.dark .btn-outline:hover:not(:disabled){background:rgba(45,212,191,.14);}
html.dark .btn-ghost{color:var(--bs-text);}
html.dark .btn-ghost:hover:not(:disabled){background:var(--bs-surface-2);}
html.dark .input{background:var(--bs-surface-2);color:var(--bs-text);border-color:var(--bs-border);}
html.dark .input::placeholder{color:#7A8AA3;}
html.dark select.input option{background:var(--bs-surface-2);color:var(--bs-text);}
html.dark td{border-bottom-color:var(--bs-border);}
html.dark tr:hover td{background:var(--bs-surface-2);}
html.dark ::-webkit-scrollbar-thumb{background:#33415C;}
html.dark .map-box{background:linear-gradient(135deg,#0E3B36,#123048);}
html.dark .alert-card{background:#2A1E0C;border-color:#6B4A12;}
/* tailwind utility overrides */
html.dark .bg-white,html.dark .bg-gray-50,html.dark .bg-slate-50,html.dark .bg-gray-100{background-color:var(--bs-surface)!important;}
html.dark .bg-white\/90{background-color:rgba(17,28,49,.9)!important;}
html.dark .bg-white\/80{background-color:rgba(17,28,49,.8)!important;}
html.dark .text-gray-900,html.dark .text-gray-800,html.dark .text-slate-800,html.dark .text-slate-900{color:#F1F5F9!important;}
html.dark .text-gray-700,html.dark .text-gray-600,html.dark .text-slate-700,html.dark .text-slate-600{color:#CBD5E1!important;}
html.dark .text-gray-500,html.dark .text-gray-400,html.dark .text-slate-500,html.dark .text-slate-400{color:#94A3B8!important;}
html.dark .border,html.dark .border-t,html.dark .border-b,html.dark .border-l,html.dark .border-r{border-color:var(--bs-border);}
html.dark .hover\:bg-gray-50:hover,html.dark .hover\:bg-gray-100:hover{background-color:var(--bs-surface-2)!important;}
html.dark .hover\:text-teal-700:hover{color:#5EEAD4!important;}
html.dark .shadow,html.dark .shadow-sm,html.dark .shadow-md,html.dark .shadow-lg{box-shadow:0 4px 14px rgba(0,0,0,.55)!important;}
/* ===================== SETTINGS MENU ===================== */
.bs-set-wrap{position:relative;}
#bsSetPanel{position:fixed;z-index:9999;width:250px;background:#fff;border:1px solid var(--bs-border);border-radius:14px;box-shadow:0 12px 34px rgba(15,23,42,.18);padding:14px;font-family:'Inter',sans-serif;}
html.dark #bsSetPanel{background:var(--bs-surface);box-shadow:0 12px 34px rgba(0,0,0,.6);}
#bsSetPanel[hidden]{display:none;}
.bs-set-title{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--bs-grey);margin:0 0 7px;}
.bs-seg{display:flex;gap:6px;background:#F1F5F9;padding:4px;border-radius:10px;}
html.dark .bs-seg{background:var(--bs-surface-2);}
.bs-seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--bs-grey);font:600 13px 'Inter',sans-serif;padding:8px 6px;border-radius:8px;cursor:pointer;}
.bs-seg button:hover{color:var(--bs-text);}
.bs-seg button[aria-checked="true"]{background:var(--bs-green);color:#fff;}
html.dark .bs-seg button[aria-checked="true"]{background:var(--bs-green-mid);color:#06231f;}
.bs-seg button:focus-visible{outline:2px solid var(--bs-green-mid);outline-offset:1px;}
.bs-set-div{height:1px;background:var(--bs-border);margin:13px 0;}
#bsSetBtnFloat{position:fixed;right:18px;bottom:18px;z-index:9998;width:46px;height:46px;border-radius:999px;border:1px solid var(--bs-border);background:#fff;color:var(--bs-text);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(15,23,42,.16);}
html.dark #bsSetBtnFloat{background:var(--bs-surface);}

/* dark-mode fixes for inline styles + misc surfaces */
html.dark [style*="color:var(--bs-dark)"]{color:#F1F5F9!important;}
html.dark [style*="background:#F8FAFC"],html.dark [style*="background:#fff"]{background:var(--bs-surface-2)!important;}
html.dark .checklist-item,html.dark .gps-stat,html.dark .gps-veh,html.dark .gps-chip{background:var(--bs-surface);color:var(--bs-text);}
html.dark .pill-registered{background:#26324A;color:#CBD5E1;}
html.dark .pill-high{background:#4A1C1C;color:#FCA5A5;}
html.dark .pill-medium,html.dark .pill-pending{background:#4A3410;color:#FCD34D;}
html.dark .pill-low,html.dark .pill-verified,html.dark .pill-resolved{background:#123B2C;color:#6EE7B7;}
html.dark .pill-assigned{background:#1B3364;color:#93C5FD;}
html.dark .pill-transit{background:#0E3B36;color:#5EEAD4;}
html.dark .pill-arrived{background:#1B3364;color:#BFDBFE;}
html.dark .pill-critical{background:#4A1C1C;color:#FCA5A5;}
html.dark .demo-badge{background:var(--bs-surface-2);color:var(--bs-grey);}
html.dark th{color:var(--bs-grey);border-bottom-color:var(--bs-border);}
html.dark .step-dot{color:#06231f;}
html.dark img[src^="data:image/png"]{filter:none;}
/* logo: sits on a white chip on dark surfaces so the dark-green/teal artwork stays readable */
.bs-logo-chip{background:#fff;border-radius:8px;padding:3px;}
html.dark .bs-logo{background:#fff;border-radius:10px;padding:4px;}

/* ===================== HOSPITAL — WASTE SEGREGATION ===================== */
.seg-cat{background:#fff;border:1px solid var(--bs-border);border-top-width:3px;border-radius:14px;padding:14px 15px;box-shadow:0 1px 2px rgba(15,23,42,0.04);}
html.dark .seg-cat{background:var(--bs-surface);}
.seg-cat-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.seg-cat-name{font-size:13.5px;font-weight:700;color:var(--bs-text);line-height:1.25;}
.seg-cat-val{font-size:22px;font-weight:800;color:var(--bs-dark);line-height:1;letter-spacing:-.4px;}
html.dark .seg-cat-val{color:#F1F5F9;}
.seg-cat-sub{font-size:11px;color:var(--bs-grey);}
.seg-bar{height:7px;border-radius:999px;background:#E2E8F0;overflow:hidden;}
html.dark .seg-bar{background:#26324A;}
.seg-bar span{display:block;height:100%;border-radius:999px;transition:width .4s ease;}
.seg-flow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;}
.seg-flow-step{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--bs-grey);background:#fff;border:1px solid var(--bs-border);border-radius:999px;padding:6px 12px;white-space:nowrap;}
html.dark .seg-flow-step{background:var(--bs-surface);}
.seg-flow-step .seg-flow-n{width:17px;height:17px;border-radius:999px;background:var(--bs-green-light);color:var(--bs-green);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
html.dark .seg-flow-step .seg-flow-n{background:rgba(45,212,191,.16);color:var(--bs-green);}
.seg-flow-arrow{color:#CBD5E1;flex-shrink:0;}
html.dark .seg-flow-arrow{color:#3A4864;}
.seg-modal{background:#fff;border-radius:16px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 20px 50px rgba(15,23,42,.28);}
html.dark .seg-modal{background:var(--bs-surface);}
.seg-modal-head{position:sticky;top:0;z-index:2;background:inherit;border-bottom:1px solid var(--bs-border);padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-radius:16px 16px 0 0;}
.seg-cam{position:relative;width:100%;aspect-ratio:4/3;background:#0B1220;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.seg-cam video{width:100%;height:100%;object-fit:cover;display:block;}
.seg-cam-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:#64748B;font-size:12.5px;font-weight:600;text-align:center;padding:18px;}
.seg-frame{position:absolute;inset:13%;border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 9999px rgba(11,18,32,.42);overflow:hidden;pointer-events:none;}
.seg-frame.is-scanning::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--bs-green-mid);box-shadow:0 0 10px var(--bs-green-mid);animation:segScanLine 2s ease-in-out infinite;}
@keyframes segScanLine{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}
@media(prefers-reduced-motion:reduce){.seg-frame.is-scanning::after{animation:none;top:50%}}
.seg-cam-badge{position:absolute;left:12px;top:12px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:rgba(15,23,42,.72);border:1px solid rgba(255,255,255,.22);padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;}
.seg-ok{background:#F0FDF4;border:1px solid #BBF7D0;border-left:4px solid var(--bs-success);border-radius:12px;}
html.dark .seg-ok{background:#0F2B20;border-color:#1C5E43;}
.seg-kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--bs-border);}
.seg-kv:last-child{border-bottom:none;}
.seg-kv .k{font-size:11.5px;font-weight:600;color:var(--bs-grey);flex-shrink:0;}
.seg-kv .v{font-size:12.5px;font-weight:700;color:var(--bs-text);text-align:right;}
.seg-seg{display:inline-flex;gap:4px;background:#F1F5F9;padding:4px;border-radius:10px;}
html.dark .seg-seg{background:var(--bs-surface-2);}
.seg-seg button{border:0;background:transparent;color:var(--bs-grey);font:600 12.5px 'Inter',sans-serif;padding:6px 13px;border-radius:7px;cursor:pointer;white-space:nowrap;}
.seg-seg button:hover{color:var(--bs-text);}
.seg-seg button[aria-pressed="true"]{background:var(--bs-green);color:#fff;}
html.dark .seg-seg button[aria-pressed="true"]{background:var(--bs-green-mid);color:#06231f;}
.seg-seg button:focus-visible{outline:2px solid var(--bs-green-mid);outline-offset:1px;}
.seg-link{background:none;border:0;padding:0;font:600 12.5px 'Inter',sans-serif;color:var(--bs-green);cursor:pointer;}
.seg-link:hover{text-decoration:underline;}
.seg-link.is-muted{color:var(--bs-grey);}
</style>

  'Human Anatomical Waste': {risk:'HIGH', handling:'Place in a yellow biohazard bag. Refrigerate if storage exceeds the prescribed limit and hand over only to an authorized collector.'},
  'Animal Waste': {risk:'HIGH', handling:'Double-bag in yellow biohazard bags and store in designated cold storage until collection.'},
  'Microbiology/Biotechnology Waste': {risk:'HIGH', handling:'Autoclave on-site where possible, then pack in red biohazard bags for high-risk infectious waste.'},
  'Sharps': {risk:'HIGH', handling:'Place in an approved puncture-resistant sharps container. Do not overfill beyond the fill line.'},
  'Discarded Medicines': {risk:'MEDIUM', handling:'Store in a sealed container clearly labeled "Pharmaceutical Waste", away from general waste streams.'},
  'Contaminated Waste': {risk:'HIGH', handling:'Segregate in yellow bags. Avoid direct contact and always handle with gloves.'},
  'Chemical Waste': {risk:'MEDIUM', handling:'Store in leak-proof, chemical-resistant containers labeled with the chemical composition.'},

function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8).toUpperCase(); }
function nowStr(){ const d=new Date(); return d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysAgoISO(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

function seedRecords(){
  const seedDefs = [
    {facility:'GreenLife Medical Center', category:'Sharps', qty:4.5, unit:'kg', dept:'Surgery', date:daysAgoISO(6), status:STATUS.VERIFIED, collector:'C2'},
    {facility:'Central Multispeciality Hospital', category:'Human Anatomical Waste', qty:2.1, unit:'kg', dept:'Pathology', date:daysAgoISO(5), status:STATUS.VERIFIED, collector:'C3'},
    {facility:'District Health Clinic', category:'General Waste', qty:12, unit:'kg', dept:'OPD', date:daysAgoISO(5), status:STATUS.VERIFIED, collector:'C1'},
    {facility:'GreenLife Medical Center', category:'Chemical Waste', qty:3.2, unit:'kg', dept:'Laboratory', date:daysAgoISO(4), status:STATUS.VERIFIED, collector:'C2'},
    {facility:'City Care Hospital', category:'Discarded Medicines', qty:1.8, unit:'kg', dept:'Pharmacy', date:daysAgoISO(4), status:STATUS.VERIFIED, collector:'C1'},
    {facility:'Central Multispeciality Hospital', category:'Contaminated Waste', qty:6.4, unit:'kg', dept:'ICU', date:daysAgoISO(3), status:STATUS.IN_TRANSIT, collector:'C3'},
    {facility:'District Health Clinic', category:'Sharps', qty:1.1, unit:'kg', dept:'Vaccination', date:daysAgoISO(2), status:STATUS.ASSIGNED, collector:'C1'},
    {facility:'GreenLife Medical Center', category:'Microbiology/Biotechnology Waste', qty:2.9, unit:'kg', dept:'Lab', date:daysAgoISO(2), status:STATUS.REQUESTED, collector:null},
    {facility:'City Care Hospital', category:'General Waste', qty:9.0, unit:'kg', dept:'Wards', date:daysAgoISO(1), status:STATUS.VERIFIED, collector:'C1'},
    {facility:'City Care Hospital', category:'Animal Waste', qty:1.4, unit:'kg', dept:'Research', date:todayISO(), status:STATUS.REGISTERED, collector:null},
  ];
  let counter = 100;
  return seedDefs.map((s,i)=>{
    counter++;
    const info = CATEGORY_INFO[s.category];
    const rec = {
      id: uid('WR-'),
      trackingId: (s.status!==STATUS.REGISTERED) ? `MW-2026-${String(counter).padStart(5,'0')}` : null,
      facility: s.facility, category: s.category, quantity: s.qty, unit: s.unit,
      department: s.dept, genDate: s.date, priority: info.risk==='HIGH' ? 'High' : 'Normal',
      notes:'', image:null, risk: info.risk, confidence: 90+Math.floor(Math.random()*8),
      handling: info.handling, status: s.status,
      collectorId: s.collector, collectorName: s.collector ? DEFAULT_COLLECTORS.find(c=>c.id===s.collector).name : null,
      pickupLocation:'Central Store Room', preferredTime:'10:00 AM - 12:00 PM',
      timeline:[{label:'Waste Registered', time:s.date}]
    };
    if(rec.status!==STATUS.REGISTERED) rec.timeline.push({label:'Collection Requested', time:s.date});
    if(['ASSIGNED','IN_TRANSIT','VERIFIED'].includes(rec.status)) rec.timeline.push({label:'Collector Assigned', time:s.date});
    if(['IN_TRANSIT','VERIFIED'].includes(rec.status)) rec.timeline.push({label:'Collector In Transit', time:s.date});
    if(rec.status==='VERIFIED') rec.timeline.push({label:'Collection Verified & Completed', time:s.date});
    return rec;
  });
}

let STATE = null;
function loadState(){
  try{
    const raw = localStorage.getItem('bioshield_state_v1');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.wasteRecords){
        if(!parsed.alerts) parsed.alerts = defaultState().alerts;
        STATE = parsed;
        return;
      }
    }
  }catch(e){}
  STATE = defaultState();
}
function saveState(){
  try{
    const clone = JSON.parse(JSON.stringify(STATE));
    clone.wasteRecords.forEach(r=>{ r.image = null; });
    localStorage.setItem('bioshield_state_v1', JSON.stringify(clone));
  }catch(e){ /* storage may be unavailable, continue in-memory */ }
}
function resetDemo(){
  localStorage.removeItem('bioshield_state_v1');
  STATE = defaultState();
  render();
  toast('Demo data has been reset.');
}

/* ============================= HELPERS ============================= */
function $(id){ return document.getElementById(id); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pill(status){ return `<span class="pill ${STATUS_PILL[status]}">${STATUS_LABEL[status]}</span>`; }
function riskPill(risk){ const cls = risk==='HIGH'?'pill-high':(risk==='MEDIUM'?'pill-medium':'pill-low'); return `<span class="pill ${cls}">${risk}</span>`; }
function toast(msg){
  const root = $('toast-root');
  const el = document.createElement('div');
  el.className = 'toast fade-in';
  el.innerHTML = `<i data-lucide="check-circle-2" style="width:18px;height:18px"></i><span>${esc(msg)}</span>`;
  root.appendChild(el);
  if(window.lucide) lucide.createIcons();
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}
function pushNotification(text, audience, level){
  STATE.notifications.unshift({id:uid('N'), text, time:nowStr(), read:false, audience:audience||'all', level:level||'info'});
}
function facilityRecords(name){ return STATE.wasteRecords.filter(r=>r.facility===name); }
function findRecord(id){ return STATE.wasteRecords.find(r=>r.id===id); }

function setView(view, params){
  STATE.view = view;
  STATE.params = params || {};
  window.scrollTo(0,0);
  render();
}
function logout(){
  STATE.session = {role:null, name:''};
  setView('landing');
}

/* ============================= APP (event handlers exposed globally) ============================= */
const App = {};

App.scrollTo = function(id){
  if(STATE.view!=='landing'){ setView('landing'); setTimeout(()=>App.scrollTo(id), 60); return; }
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
};
App.openLogin = function(){ setView('login'); };
App.loginAs = function(role){
  const names = {hospital: STATE.profile.hospitalName, collector: STATE.profile.collectorName, admin: STATE.profile.adminName};
  STATE.session = {role, name:names[role]};
  const homeView = role==='hospital' ? 'hospitalDashboard' : role==='collector' ? 'collectorDashboard' : 'adminOverview';
  setView(homeView);
  toast(`Signed in as ${names[role]}`);
};
App.go = function(view, params){ setView(view, params); };
App.toggleMobileNav = function(){
  const el = $('mobile-drawer');
  if(el) el.classList.toggle('hidden');
};

/* ---- Register Waste flow ---- */
App.handleImageUpload = function(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    App._pendingImage = e.target.result;
    const prev = $('upload-preview');
    if(prev){ prev.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover rounded-xl">`; }
  };
  reader.readAsDataURL(file);
};
App.submitRegister = function(ev){
  ev.preventDefault();
  const f = ev.target;
  const category = f.category.value;
  const info = CATEGORY_INFO[category];
  STATE.draft = {
    id: uid('WR-'),
    facility: STATE.profile.hospitalName,
    category, quantity: parseFloat(f.quantity.value)||0, unit: f.unit.value,
    department: f.department.value, genDate: f.genDate.value || todayISO(),
    priority: f.priority.value, notes: f.notes.value,
    image: App._pendingImage || null,
    risk: info.risk, confidence: 90+Math.floor(Math.random()*8), handling: info.handling,
    status: STATUS.REGISTERED, collectorId:null, collectorName:null,
    pickupLocation:'Central Store Room', preferredTime:'10:00 AM - 12:00 PM',
    timeline:[{label:'Waste Registered', time:nowStr()}]
  };
  App._pendingImage = null;
  setView('aiClassification');
};
App.correctClassification = function(){
  const options = CATEGORIES.filter(c=>c!==STATE.draft.category);
  const choice = prompt('Correct the detected category to:\n' + CATEGORIES.join(', '), STATE.draft.category);
  if(choice && CATEGORY_INFO[choice.trim()]){
    const info = CATEGORY_INFO[choice.trim()];
    STATE.draft.category = choice.trim();
    STATE.draft.risk = info.risk;
    STATE.draft.handling = info.handling;
    STATE.draft.confidence = 90+Math.floor(Math.random()*8);
    render();
    toast('Classification updated.');
  } else if(choice){
    alert('Please enter one of the listed categories exactly.');
  }
};
App.confirmClassification = function(){
  STATE.wasteRecords.unshift(STATE.draft);
  const rec = STATE.draft;
  STATE.draft = null;
  pushNotification(`Waste ${rec.category} registered and classified (${rec.risk} risk).`, 'hospital');
  saveState();
  setView('pickupRequest', {id: rec.id});
};

/* ---- Pickup Request ---- */
App.submitPickupRequest = function(ev){
  ev.preventDefault();
  const f = ev.target;
  const rec = findRecord(STATE.params.id);
  if(!rec) return;
  rec.pickupLocation = f.location.value;
  rec.preferredTime = f.preferredTime.value;
  rec.priority = f.priority.value;
  rec.status = STATUS.REQUESTED;
  STATE.counters.tracking += 1;
  rec.trackingId = `MW-2026-${String(STATE.counters.tracking).padStart(5,'0')}`;
  rec.timeline.push({label:'Collection Requested', time:nowStr()});
  pushNotification(`Collection request ${rec.trackingId} submitted for ${rec.facility}.`, 'collector');
  saveState();
  setView('pickupSuccess', {id: rec.id});
};

/* ---- Collector actions ---- */
App.acceptRequest = function(id){
  const rec = findRecord(id);
  if(!rec) return;
  rec.status = STATUS.ASSIGNED;
  rec.collectorId = 'C1';
  rec.collectorName = STATE.profile.collectorName;
  rec.timeline.push({label:'Collector Assigned', time:nowStr()});
  pushNotification(`Pickup request ${rec.trackingId} accepted by ${rec.collectorName}.`, 'hospital');
  saveState();
  toast('Request accepted.');
  render();
};
App.startJourney = function(id){
  const rec = findRecord(id);
  rec.status = STATUS.IN_TRANSIT;
  rec.timeline.push({label:'Collector In Transit', time:nowStr()});
  pushNotification(`Collector is on the way for ${rec.trackingId}.`, 'hospital');
  saveState(); render();
};
App.markArrived = function(id){
  const rec = findRecord(id);
  rec.status = STATUS.ARRIVED;
  rec.timeline.push({label:'Collector Arrived at Facility', time:nowStr()});
  pushNotification(`Collector has arrived at ${rec.facility} for ${rec.trackingId}.`, 'hospital');
  saveState(); render();
};
App.goVerify = function(id){ setView('collectionVerification', {id}); };

App.toggleCheck = function(idx){
  App._checks = App._checks || {};
  App._checks[idx] = !App._checks[idx];
  render();
};
App.confirmCollection = function(id){
  const rec = findRecord(id);
  rec.status = STATUS.VERIFIED;
  rec.timeline.push({label:'Collection Verified & Completed', time:nowStr()});
  App._checks = {};
  pushNotification(`Collection ${rec.trackingId} verified and completed.`, 'all');
  pushNotification(`High-risk waste ${rec.trackingId} requires attention on arrival.`, 'admin', rec.risk==='HIGH' ? 'warning' : 'info');
  saveState();
  setView('collectionVerifiedSuccess', {id});
};

/* ---- Notifications ---- */
App.markAllRead = function(){
  STATE.notifications.forEach(n=>n.read=true);
  saveState(); render();
};

/* ---- Reports ---- */
App.generateReport = function(type){
  App._reportType = type;
  render();
};
App.exportReport = function(type){
  const rows = [['Waste ID','Tracking ID','Facility','Category','Quantity','Unit','Risk','Date','Collector','Status']];
  STATE.wasteRecords.forEach(r=>{
    rows.push([r.id, r.trackingId||'-', r.facility, r.category, r.quantity, r.unit, r.risk, r.genDate, r.collectorName||'-', STATUS_LABEL[r.status]]);
  });
  const csv = rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `BioShield_${type.replace(/\s+/g,'_')}_${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Report exported as CSV.');
};

/* ---- Profile ---- */
App.saveProfile = function(ev, role){
  ev.preventDefault();
  const f = ev.target;
  if(role==='hospital'){ STATE.profile.hospitalName = f.name.value; STATE.profile.hospitalEmail = f.email.value; }
  if(role==='collector'){ STATE.profile.collectorName = f.name.value; STATE.profile.collectorPhone = f.phone.value; }
  if(role==='admin'){ STATE.profile.adminName = f.name.value; STATE.profile.adminEmail = f.email.value; }
  STATE.session.name = f.name.value;
  saveState(); render();
  toast('Profile updated.');
};

App.clearFilters = function(){ App._filters = {search:'', category:'', risk:'', status:'', from:'', to:''}; render(); };

/* ---- Alert Mode (biohazard / improper segregation alerts) ---- */
App._showAlertForm = false;
App.toggleAlertForm = function(){ App._showAlertForm = !App._showAlertForm; render(); };
App.submitAlert = function(ev){
  ev.preventDefault();
  const f = ev.target;
  const alert = {
    id: uid('AL-'), facility: f.facility.value, category: f.category.value,
    description: f.description.value, severity: f.severity.value,
    time: nowStr(), resolved: false
  };
  STATE.alerts.unshift(alert);
  pushNotification(`Biohazard alert reported at ${alert.facility}: ${alert.category} improperly segregated.`, 'admin', 'warning');
  App._showAlertForm = false;
  saveState();
  toast('Alert reported.');
  render();
};
App.resolveAlert = function(id){
  const a = STATE.alerts.find(x=>x.id===id);
  if(!a) return;
  a.resolved = true;
  pushNotification(`Biohazard alert at ${a.facility} marked resolved.`, 'admin');
  saveState();
  toast('Alert marked resolved.');
  render();
};
function alertAutoList(){
  return STATE.wasteRecords.filter(r=> r.risk==='HIGH' && ['REGISTERED','REQUESTED','ASSIGNED'].includes(r.status));
}
function alertCount(){
  return alertAutoList().length + STATE.alerts.filter(a=>!a.resolved).length;
}

function reportsPanel(role, prefix){
  const types = ['Daily Waste Report','Monthly Collection Report','Facility Report','High-Risk Waste Report','Collector Performance Report'];
  const active = App._reportType;
  const recs = STATE.wasteRecords;
  let summary = '';
  if(active){
    if(active==='Daily Waste Report'){
      const today = recs.filter(r=>r.genDate===todayISO());
      summary = `${today.length} waste items registered today across all facilities, totalling ${today.reduce((s,r)=>s+r.quantity,0).toFixed(1)} kg.`;
    } else if(active==='Monthly Collection Report'){
      const verified = recs.filter(r=>r.status===STATUS.VERIFIED);
      summary = `${verified.length} collections verified and completed this period out of ${recs.length} total registered items.`;
    } else if(active==='Facility Report'){
      summary = STATE.facilities.map(f=>`${f.name}: ${facilityRecords(f.name).length} records`).join(' · ');
    } else if(active==='High-Risk Waste Report'){
      const high = recs.filter(r=>r.risk==='HIGH');
      summary = `${high.length} high-risk waste items recorded, requiring priority handling and verified collection.`;
    } else if(active==='Collector Performance Report'){
      summary = STATE.collectors.map(c=>`${c.name}: ${recs.filter(r=>r.collectorId===c.id && r.status===STATUS.VERIFIED).length} completed`).join(' · ');
    }
  }
  return shell(role, prefix+'Reports', `
    <h1 class="text-2xl font-bold text-gray-800 mb-5">Reports</h1>
    <div class="grid md:grid-cols-2 gap-4">
      ${types.map(t=>`
        <div class="card p-5">
          <div class="flex items-center justify-between">
            <h3 class="font-semibold text-gray-800">${t}</h3>
            <i data-lucide="file-bar-chart" style="width:18px;height:18px;color:var(--bs-green)"></i>
          </div>
          <div class="flex gap-2 mt-4">
            <button onclick="App.generateReport('${t}')" class="btn btn-outline btn-sm">Generate Report</button>
            <button onclick="App.exportReport('${t}')" class="btn btn-primary btn-sm"><i data-lucide="download" style="width:14px;height:14px"></i>Export Report</button>
          </div>
          ${active===t ? `<div class="mt-4 p-3 rounded-lg text-sm text-gray-600 fade-in" style="background:var(--bs-green-light)">${esc(summary)}</div>` : ''}
        </div>`).join('')}
    </div>
  `);
}

function renderAnalyticsCharts(){
  if(!window.Chart) return;
  destroyCharts();
  const recs = STATE.wasteRecords;
  const palette = ['#0F766E','#14B8A6','#2563EB','#F59E0B','#EF4444','#2563EB','#0F172A','#64748B'];

  const byCat = {};
  CATEGORIES.forEach(c=>byCat[c]=0);
  recs.forEach(r=>byCat[r.category]=(byCat[r.category]||0)+1);
  chartRegistry.cat = new Chart($('chartCategory'), {type:'bar', data:{labels:Object.keys(byCat), datasets:[{data:Object.values(byCat), backgroundColor:'#14B8A6', borderRadius:6}]}, options:{plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:9}}}}}});

  const days = [...Array(7)].map((_,i)=>daysAgoISO(6-i));
  const trend = days.map(d=>recs.filter(r=>r.genDate===d).length);
  chartRegistry.trend = new Chart($('chartTrend'), {type:'line', data:{labels:days.map(d=>d.slice(5)), datasets:[{data:trend, borderColor:'#0F766E', backgroundColor:'rgba(15,118,110,0.12)', fill:true, tension:.35}]}, options:{plugins:{legend:{display:false}}}});

  const verified = recs.filter(r=>r.status===STATUS.VERIFIED).length;
  chartRegistry.comp = new Chart($('chartCompletion'), {type:'doughnut', data:{labels:['Completed','In Progress'], datasets:[{data:[verified, recs.length-verified], backgroundColor:['#059669','#E2E8F0']}]}});

  const byRisk = {HIGH:0,MEDIUM:0,LOW:0};
  recs.forEach(r=>byRisk[r.risk]++);
  chartRegistry.risk = new Chart($('chartRisk'), {type:'pie', data:{labels:Object.keys(byRisk), datasets:[{data:Object.values(byRisk), backgroundColor:['#EF4444','#F59E0B','#059669']}]}});

  const byFac = {};
  STATE.facilities.forEach(f=>byFac[f.name]=facilityRecords(f.name).length);
  chartRegistry.fac = new Chart($('chartFacility'), {type:'bar', data:{labels:Object.keys(byFac).map(n=>n.split(' ')[0]), datasets:[{data:Object.values(byFac), backgroundColor:'#2563EB', borderRadius:6}]}, options:{plugins:{legend:{display:false}}}});

  const byColl = {};
  STATE.collectors.forEach(c=>byColl[c.name.split(' ')[0]]=recs.filter(r=>r.collectorId===c.id && r.status===STATUS.VERIFIED).length);
  chartRegistry.perf = new Chart($('chartPerformance'), {type:'bar', data:{labels:Object.keys(byColl), datasets:[{data:Object.values(byColl), backgroundColor:'#2563EB', borderRadius:6}]}, options:{plugins:{legend:{display:false}}}});
}

function gpsAgeText(sec){
  if(sec < 60) return `Updated ${sec} sec ago`;
  const m = Math.floor(sec/60);
  if(m < 60) return `Updated ${m} min ago`;
  return `Updated ${Math.floor(m/60)} hr ago`;
}
function gpsVehicle(id){ return FLEET.find(v=>v.id===id); }
function gpsMatchesFilter(v){
  return GPS.filter==='All Waste' || WASTE_META[v.waste].short === GPS.filter;

function gpsVisible(){
  const q = GPS.query.trim().toLowerCase();

  });
}

  list.innerHTML = gpsListHtml();
  if(det) det.innerHTML = gpsDetailHtml();
  if(mk) mk.innerHTML = gpsMarkersHtml();
  if(cv) cv.setAttribute('style', gpsMapTransform());
  document.querySelectorAll('#gpsChips .gps-chip').forEach(b=>{

function startGpsClock(){
  stopGpsClock();

    FLEET.forEach(v=>{ v.age += 5; if(v.status!=='OFFLINE' && v.age > 240) v.age = 5 + Math.floor(Math.random()*25); });
    document.querySelectorAll('.gps-age').forEach(el=>{
      const v = gpsVehicle(el.dataset.veh);
      if(v) el.textContent = gpsAgeText(v.age);
    });

function segDT(daysAgo, hh, mm){
  const d = new Date(); d.setDate(d.getDate()-daysAgo); d.setHours(hh, mm, 0, 0);
  const p = n=>segPad(n,2);
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(hh)}:${p(mm)}`;
}
function segNowDT(){
  const d = new Date(); const p = n=>segPad(n,2);
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function segFmtDT(dt){
  if(!dt) return '—';
  const d = new Date(dt);

  return d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});
}
function segDaysSince(dt){
  const d = new Date(dt); if(isNaN(d)) return 999;
  const a = new Date(); a.setHours(0,0,0,0);
  const b = new Date(d); b.setHours(0,0,0,0);
  return Math.round((a-b)/86400000);
}

function segEnsure(){

  const s = STATE.segregation;

  if(!Array.isArray(s.entries)   || !s.entries.length)     s.entries   = segSeedEntries();
  if(!Array.isArray(s.log))                                s.log       = segSeedLog();
  if(typeof s.counter !== 'number')                        s.counter   = 1000 + s.entries.length;
  return s;
}

/* transient UI state — deliberately not persisted */
const SEG = {
  range:'today', modal:null, editId:null, viewId:null, prefill:null,
  search:'', fCat:'', fDept:'', fStatus:'', fDate:'',
  cam:{state:'idle', detected:null, confidence:0, error:''},
  qr:{state:'idle', input:'', binId:null, error:''},
  stream:null
};

function segAll(){ return segEnsure().entries; }
function segContainers(){ return segEnsure().containers; }
function segLog(){ return segEnsure().log; }
function segFindEntry(id){ return segAll().find(e=>e.id===id); }
function segFindBin(id){ return segContainers().find(c=>c.id===(id||'').trim().toUpperCase()); }
function segFill(c){ return c.capacity ? Math.min(100, Math.round((c.qty/c.capacity)*100)) : 0; }
function segAutoStatus(c){
  if(c.status==='COLLECTED' || c.status==='UNVERIFIED') return c.status;
  const f = segFill(c);
  if(f>=95) return 'READY';
  if(f>=75) return 'NEAR';
  return 'ACTIVE';
}
function segRangeDays(){ return SEG.range==='today' ? 0 : (SEG.range==='week' ? 6 : 29); }
function segInRange(e){ return segDaysSince(e.dt) <= segRangeDays(); }
function segRangeEntries(){ return segAll().filter(segInRange); }
function segRangeLabel(){ return SEG.range==='today' ? 'today' : (SEG.range==='week' ? 'this week' : 'this month'); }
function segQtyBy(cat, list){
  return (list||segRangeEntries()).filter(e=>!cat || e.category===cat)
    .reduce((s,e)=> s + (parseFloat(e.qty)||0), 0);
}
function segNum(n){ return (Math.round(n*10)/10).toFixed(1); }
function segDepartments(){
  return [...new Set(segAll().map(e=>e.dept))].sort();
}
function segStaffList(){
  return [...new Set(segAll().map(e=>e.staff))].sort();
}

/* ---------- section 8: verification & alerts ---------- */
function segAlertsHtml(){
  const alerts = [];
  const pending = segAll().filter(e=>e.verification==='Pending');
  if(pending.length) alerts.push({type:'warn', icon:'shield-alert', text:`${pending.length} waste record${pending.length===1?'':'s'} require${pending.length===1?'s':''} verification.`, time:'Open'});
  segContainers().forEach(c=>{
    const st = segAutoStatus(c);
    if(st==='NEAR')       alerts.push({type:'warn', icon:'triangle-alert', text:`Container ${c.id} approaching capacity (${segFill(c)}% full) in ${c.location}.`, time:segFmtDT(c.updated)});
    if(st==='READY')      alerts.push({type:'warn', icon:'package-check',  text:`Container ${c.id} is ready for collection from ${c.location}.`, time:segFmtDT(c.updated)});
    if(st==='UNVERIFIED') alerts.push({type:'warn', icon:'circle-help',    text:`Waste category for container ${c.id} requires staff confirmation.`, time:segFmtDT(c.updated)});
  });
  if(SEG.qr.state==='error') alerts.push({type:'warn', icon:'scan-barcode', text:'QR / barcode scan incomplete — container could not be matched.', time:'Just now'});
  const ok = segLog().slice(0,4).map(l=>({type:'ok', icon:l.type==='ok'?'check-circle-2':'info', text:l.text, time:l.time}));

  const render = a => `
    <div class="${a.type==='ok'?'seg-ok':'alert-card'} p-3.5 flex items-start gap-3">
      <i data-lucide="${a.icon}" style="width:16px;height:16px;flex-shrink:0;margin-top:1px;color:${a.type==='ok'?'var(--bs-success)':'var(--bs-amber)'}"></i>
      <div class="min-w-0">
        <p class="text-[13px] font-medium text-gray-700 leading-snug">${esc(a.text)}</p>
        <p class="text-[11px] text-gray-400 mt-1">${esc(a.time)}</p>
      </div>
    </div>`;

  return `
  <div class="card p-5 mb-6">
    <div class="flex items-center justify-between flex-wrap gap-3 mb-4">
      <div>
        <h2 class="font-semibold text-gray-800">Verification &amp; Alerts</h2>
        <p class="text-xs text-gray-500 mt-0.5">Operational notifications from the segregation workflow.</p>
      </div>
      ${pending.length ? `<button onclick="App.segVerifyAll()" class="btn btn-outline btn-sm"><i data-lucide="shield-check" style="width:14px;height:14px"></i>Verify all pending</button>` : ''}
    </div>
    <div class="grid md:grid-cols-2 gap-3">
      ${alerts.slice(0,6).map(render).join('')}
      ${ok.map(render).join('')}
      ${(!alerts.length && !ok.length) ? '<p class="text-sm text-gray-400">No notifications right now.</p>' : ''}
    </div>
  </div>`;
}

function renderSegregationCharts(){
  if(!window.Chart) return;
  destroyCharts();
  const list = segRangeEntries();
  const gridColor = document.documentElement.classList.contains('dark') ? 'rgba(148,163,184,.18)' : 'rgba(100,116,139,.14)';
  const tick = {font:{size:10}, color:'#94A3B8'};
  const baseOpts = {responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{x:{ticks:tick, grid:{display:false}}, y:{ticks:tick, grid:{color:gridColor}, beginAtZero:true}}};

  const vol = $('segChartVolume');
  if(vol){
    const days = [...Array(7)].map((_,i)=>6-i);
    const labels = days.map(d=>{ const x=new Date(); x.setDate(x.getDate()-d); return x.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); });
    const data = days.map(d=>segAll().filter(e=>segDaysSince(e.dt)===d).reduce((s,e)=>s+(parseFloat(e.qty)||0),0));
    chartRegistry.segVolume = new Chart(vol, {type:'line',
      data:{labels, datasets:[{data, borderColor:'#0F766E', backgroundColor:'rgba(15,118,110,0.12)', fill:true, tension:.35, pointRadius:3}]},
      options:baseOpts});
  }
  const cat = $('segChartCat');
  if(cat){
    chartRegistry.segCat = new Chart(cat, {type:'doughnut',
      data:{labels:SEG_CATS.map(c=>segCatMeta(c).short),
            datasets:[{data:SEG_CATS.map(c=>Math.round(segQtyBy(c,list)*10)/10), backgroundColor:SEG_CATS.map(c=>segCatMeta(c).color), borderWidth:0}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:9, font:{size:10}, color:'#94A3B8'}}}}});
  }
  const dept = $('segChartDept');
  if(dept){
    const by = {};
    list.forEach(e=>{ by[e.dept] = (by[e.dept]||0) + (parseFloat(e.qty)||0); });
    const top = Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,6);
    chartRegistry.segDept = new Chart(dept, {type:'bar',
      data:{labels:top.map(t=>t[0].split(' ')[0]), datasets:[{data:top.map(t=>Math.round(t[1]*10)/10), backgroundColor:'#14B8A6', borderRadius:6}]},
      options:baseOpts});
  }
  const ver = $('segChartVerify');
  if(ver){
    const v = list.filter(e=>e.verification==='Verified').length;
    chartRegistry.segVerify = new Chart(ver, {type:'doughnut',
      data:{labels:['Verified','Pending'], datasets:[{data:[v, list.length-v], backgroundColor:['#059669','#F59E0B'], borderWidth:0}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:9, font:{size:10}, color:'#94A3B8'}}}}});
  }
  const util = $('segChartUtil');
  if(util){
    const bins = segContainers();
    chartRegistry.segUtil = new Chart(util, {type:'bar',
      data:{labels:bins.map(c=>c.id.replace('BIN-','#')),
            datasets:[{data:bins.map(segFill), backgroundColor:bins.map(c=>{const f=segFill(c); return f>=95?'#EF4444':(f>=75?'#F59E0B':'#2563EB');}), borderRadius:6}]},
      options:Object.assign({}, baseOpts, {scales:{x:{ticks:tick, grid:{display:false}}, y:{ticks:tick, grid:{color:gridColor}, beginAtZero:true, max:100}}})});
  }
}

/* ---------- camera plumbing ---------- */
function segAttachCamera(){
  const v = $('segVideo');
  if(!v) return;
  if(SEG.stream){ v.srcObject = SEG.stream; return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    SEG.cam.state = 'error';
    SEG.cam.error = 'This browser does not support live camera capture.';
    segRefresh();
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false})
    .then(st=>{
      SEG.stream = st;
      const el = $('segVideo');
      if(el) el.srcObject = st;
      else st.getTracks().forEach(t=>t.stop());
    })
    .catch(err=>{
      SEG.cam.state = 'error';
      SEG.cam.error = (err && err.name==='NotAllowedError')
        ? 'Camera permission was denied. You can still select the category manually.'
        : 'No camera could be started on this device.';
      segRefresh();
    });
}
function segStopCamera(){
  if(SEG.stream){ SEG.stream.getTracks().forEach(t=>t.stop()); SEG.stream = null; }
}
function segRefresh(){ render(); }

/* ---------- handlers ---------- */
App.segRange = function(r){ SEG.range = r; render(); };
App.segSearch = function(v){
  SEG.search = v;
  const wrap = $('segRecordsWrap');
  if(wrap){ wrap.innerHTML = segRecordsTableHtml(); if(window.lucide) lucide.createIcons(); }
};
App.segFilter = function(key, val){
  SEG[key] = val;
  const wrap = $('segRecordsWrap');
  if(wrap){ wrap.innerHTML = segRecordsTableHtml(); if(window.lucide) lucide.createIcons(); }
};
App.segClose = function(){
  SEG.modal = null; SEG.editId = null; SEG.viewId = null; SEG.prefill = null;
  segStopCamera();
  render();
};
App.segCloseBackdrop = function(ev){
  if(ev.target && ev.target.classList && ev.target.classList.contains('modal-backdrop')) App.segClose();
};
App.segOpenRecord = function(editId, containerId){
  SEG.editId = editId || null;
  SEG.prefill = editId ? null : (containerId ? {container:containerId, category:(segFindBin(containerId)||{}).category} : (SEG.prefill||null));
  SEG.viewId = null;
  SEG.modal = 'record';
  segStopCamera();
  render();
};
App.segViewEntry = function(id){ SEG.viewId = id; SEG.modal = 'view'; render(); };
App.segOpenCamera = function(){
  SEG.modal = 'camera';
  SEG.cam = {state:'idle', detected:null, confidence:0, error:''};
  render();
};
App.segOpenQr = function(binId){
  SEG.modal = 'qr';
  SEG.qr = {state: binId?'done':'idle', input: binId||'', binId: binId||null, error:''};
  segStopCamera();
  render();
};
App.segRunScan = function(){
  SEG.cam.state = 'scanning';
  render();
  setTimeout(()=>{
    if(SEG.modal!=='camera') return;
    const cat = SEG_CATS[Math.floor(Math.random()*SEG_CATS.length)];
    SEG.cam.state = 'done';
    SEG.cam.detected = cat;
    SEG.cam.confidence = 72 + Math.floor(Math.random()*24);
    render();
  }, 1600);
};
App.segRetakeScan = function(){
  SEG.cam = {state:'idle', detected:null, confidence:0, error:SEG.cam.error};
  render();
};
App.segConfirmCategory = function(){
  if(SEG.cam.state!=='done') return;
  const cat = SEG.cam.detected;
  const bin = segContainers().find(c=>c.category===cat && segAutoStatus(c)!=='COLLECTED');
  SEG.prefill = {category:cat, container:bin?bin.id:'', fromScan:true,
                 notes:`Category identified by camera scan (${SEG.cam.confidence}% match) and confirmed by ${STATE.session.name}.`};
  segStopCamera();
  SEG.modal = 'record'; SEG.editId = null;
  render();
  toast(`${cat} confirmed by staff — complete the record to save it.`);
};
App.segQrInput = function(v){ SEG.qr.input = v; };
App.segRunQr = function(){
  const typed = (SEG.qr.input||'').trim();
  SEG.qr.state = 'scanning';
  render();
  setTimeout(()=>{
    if(SEG.modal!=='qr') return;
    let bin = typed ? segFindBin(typed) : null;
    if(!typed){
      const bins = segContainers().filter(c=>segAutoStatus(c)!=='COLLECTED');
      bin = bins[Math.floor(Math.random()*bins.length)];
    }
    if(!bin){
      SEG.qr.state = 'error';
      SEG.qr.binId = null;
      SEG.qr.error = `No container matched "${typed}". Check the label and scan again.`;
    }else{
      SEG.qr.state = 'done';
      SEG.qr.binId = bin.id;
      SEG.qr.input = bin.id;
      SEG.qr.error = '';
    }
    render();
  }, 1100);
};
App.segRetakeQr = function(){ SEG.qr = {state:'idle', input:'', binId:null, error:''}; render(); };
App.segUpdateFromQr = function(){
  const bin = segFindBin(SEG.qr.binId||'');
  if(!bin) return;
  bin.updated = segNowDT();
  if(bin.status==='UNVERIFIED') bin.status = 'ACTIVE';
  bin.status = segAutoStatus(bin);
  segLog().unshift({type:'ok', text:`Container ${bin.id} scan recorded — fill level ${segFill(bin)}%.`, time:segFmtDT(bin.updated)});
  pushNotification(`Container ${bin.id} updated from a QR scan (${segFill(bin)}% full).`, 'hospital');
  saveState();
  render();
  toast(`${bin.id} updated from scan.`);
};
App.segMarkCollected = function(id){
  const bin = segFindBin(id);
  if(!bin) return;
  bin.qty = 0;
  bin.status = 'COLLECTED';
  bin.updated = segNowDT();
  segLog().unshift({type:'ok', text:`Container ${bin.id} emptied and registered as collected.`, time:segFmtDT(bin.updated)});
  pushNotification(`Container ${bin.id} marked as collected.`, 'hospital');
  saveState();
  render();
  toast(`${bin.id} marked as collected.`);
};
App.segSaveRecord = function(ev){
  ev.preventDefault();
  const f = ev.target;
  const s = segEnsure();
  const qty = parseFloat(f.qty.value) || 0;
  const data = {
    category: f.category.value,
    qty: qty,
    unit: f.unit.value,
    dept: f.dept.value.trim(),
    point: f.point.value,
    container: f.container.value,
    dt: f.dt.value,
    staff: f.staff.value.trim(),
    notes: f.notes.value.trim()
  };
  const bin = segFindBin(data.container);
  const catMismatch = bin && bin.category !== data.category;

  if(SEG.editId){
    const e = segFindEntry(SEG.editId);
    const oldQty = parseFloat(e.qty)||0;
    const oldBin = segFindBin(e.container);
    Object.assign(e, data);
    if(oldBin && oldBin!==bin) oldBin.qty = Math.max(0, oldBin.qty - oldQty);
    if(bin){
      bin.qty = Math.max(0, (oldBin===bin ? bin.qty - oldQty : bin.qty) + (data.unit==='kg' ? qty : 0));
      bin.updated = segNowDT();
      bin.status = catMismatch ? 'UNVERIFIED' : segAutoStatus(Object.assign({}, bin, {status:'ACTIVE'}));
    }
    toast(`Record ${e.id} updated.`);
    pushNotification(`Segregation record ${e.id} was updated.`, 'hospital');
  }else{
    s.counter += 1;
    const entry = Object.assign({
      id:`SW-2026-${segPad(s.counter)}`,
      verification:'Pending',
      source: (SEG.prefill && SEG.prefill.fromScan) ? 'Camera-assisted, staff confirmed' : 'Manual entry'
    }, data);
    s.entries.unshift(entry);
    if(bin){
      if(data.unit==='kg') bin.qty = Math.min(bin.capacity, bin.qty + qty);
      bin.updated = segNowDT();
      bin.status = catMismatch ? 'UNVERIFIED' : segAutoStatus(Object.assign({}, bin, {status:'ACTIVE'}));
    }
    segLog().unshift({type:'ok', text:`Segregation record ${entry.id} created for ${entry.dept}.`, time:segFmtDT(entry.dt)});
    pushNotification(`New segregation record ${entry.id} (${entry.category}, ${segNum(qty)} ${entry.unit}) awaiting verification.`, 'hospital');
    toast(`Record ${entry.id} saved — awaiting verification.`);
  }
  if(catMismatch) toast(`Category differs from ${bin.id}'s assigned stream — flagged for verification.`);

  s.entries.sort((a,b)=> a.dt < b.dt ? 1 : -1);
  SEG.modal = null; SEG.editId = null; SEG.prefill = null;
  segStopCamera();
  saveState();
  render();
};
App.segVerify = function(id){
  const e = segFindEntry(id);
  if(!e) return;
  e.verification = 'Verified';
  e.verifiedBy = STATE.session.name;
  const bin = segFindBin(e.container);
  if(bin && bin.status==='UNVERIFIED'){ bin.status = segAutoStatus(Object.assign({}, bin, {status:'ACTIVE'})); }
  segLog().unshift({type:'ok', text:`Segregation record ${e.id} verified by ${STATE.session.name}.`, time:segFmtDT(segNowDT())});
  pushNotification(`Segregation record ${e.id} has been verified.`, 'hospital');
  SEG.modal = null; SEG.viewId = null;
  saveState();
  render();
  toast(`${e.id} verified.`);
};
App.segVerifyAll = function(){
  const pending = segAll().filter(e=>e.verification==='Pending');
  if(!pending.length) return;
  pending.forEach(e=>{ e.verification = 'Verified'; e.verifiedBy = STATE.session.name; });
  segContainers().forEach(c=>{ if(c.status==='UNVERIFIED') c.status = segAutoStatus(Object.assign({}, c, {status:'ACTIVE'})); });
  segLog().unshift({type:'ok', text:`${pending.length} segregation record${pending.length===1?'':'s'} verified by ${STATE.session.name}.`, time:segFmtDT(segNowDT())});
  pushNotification(`${pending.length} segregation records verified.`, 'hospital');
  saveState();
  render();
  toast(`${pending.length} record${pending.length===1?'':'s'} verified.`);
};

/* ============================= INIT ============================= */
loadState();
if(!STATE.session.role && !['landing','login'].includes(STATE.view)){
  STATE.view = 'landing';
}
render();
</script>

<script>
(function(){
/* ---- English -> Hindi dictionary (exact, trimmed text match) ---- */
var HI = {
  "Hospital Waste Operations":"अस्पताल कचरा संचालन","Total Waste":"कुल कचरा","Pending Pickup":"लंबित पिकअप",
  "In Collection":"संग्रह में","Recent Waste Records":"हाल के कचरा रिकॉर्ड","Recent Collection Requests":"हाल के संग्रह अनुरोध",
  "Waste":"कचरा","Risk":"जोखिम","Tracking ID":"ट्रैकिंग आईडी","Reset Demo Data":"डेमो डेटा रीसेट करें",
  "Hospital Staff":"अस्पताल कर्मचारी","General Waste":"सामान्य कचरा","Animal Waste":"पशु कचरा",
  "Discarded Medicines":"त्याग की गई दवाएँ","Verified / Completed":"सत्यापित / पूर्ण","New Request":"नया अनुरोध",
  "Waste Generation":"कचरा उत्पादन","Segregation & Registration":"पृथक्करण और पंजीकरण","AI Classification":"एआई वर्गीकरण",
  "Pickup & Assignment":"पिकअप और नियुक्ति","Tracking & Verification":"ट्रैकिंग और सत्यापन",
  "How BioShield Works":"बायोशील्ड कैसे काम करता है","Open Dashboard":"डैशबोर्ड खोलें",
  "Hospitals & Clinics":"अस्पताल और क्लीनिक","Waste Collectors":"कचरा संग्राहक","Administrators":"प्रशासक",
  "Digital Healthcare Platform":"डिजिटल हेल्थकेयर प्लेटफ़ॉर्म","Smarter Medical-Waste Management":"स्मार्ट चिकित्सा-कचरा प्रबंधन",
  "Home":"होम","How It Works":"यह कैसे काम करता है","Features":"विशेषताएँ","About":"परिचय","Login":"लॉगिन","Logout":"लॉग आउट",
  "Settings":"सेटिंग्स","Appearance":"रूप-रंग","Light":"हल्का","Dark":"गहरा","Language":"भाषा","Theme":"थीम",
  "Dashboard":"डैशबोर्ड","Register Waste":"कचरा दर्ज करें","Waste Records":"कचरा रिकॉर्ड","Pickup Requests":"पिकअप अनुरोध",
  "Track Collection":"संग्रह ट्रैक करें","Notifications":"सूचनाएँ","Reports":"रिपोर्ट","Profile":"प्रोफ़ाइल",
  "My Routes":"मेरे मार्ग","Scan & Verify":"स्कैन और सत्यापन","Collection History":"संग्रह इतिहास",
  "Hospitals":"अस्पताल","Collectors":"संग्राहक","Vehicles":"वाहन","Users":"उपयोगकर्ता","Analytics":"विश्लेषण",
  "Alerts":"अलर्ट","Compliance":"अनुपालन","GPS Tracking":"जीपीएस ट्रैकिंग","Live Tracking":"लाइव ट्रैकिंग",
  "Hospital":"अस्पताल","Collector":"संग्राहक","Administrator":"प्रशासक",
  "Login as Hospital":"अस्पताल के रूप में लॉगिन","Login as Collector":"संग्राहक के रूप में लॉगिन",
  "Login as Administrator":"प्रशासक के रूप में लॉगिन","Secure Platform Access":"सुरक्षित प्लेटफ़ॉर्म एक्सेस",
  "Demo Environment":"डेमो वातावरण","Demonstration Environment":"प्रदर्शन वातावरण",
  "Back to home":"होम पर वापस","← Back to home":"← होम पर वापस",
  "Save":"सहेजें","Save Changes":"बदलाव सहेजें","Cancel":"रद्द करें","Submit":"जमा करें","Close":"बंद करें",
  "Search":"खोजें","Filter":"फ़िल्टर","All":"सभी","Status":"स्थिति","Date":"दिनांक","Actions":"कार्रवाई",
  "Type":"प्रकार","Quantity":"मात्रा","Weight":"वज़न","Notes":"टिप्पणियाँ","Details":"विवरण","View":"देखें",
  "Edit":"संपादित करें","Delete":"हटाएँ","Download":"डाउनलोड","Export":"निर्यात","Print":"प्रिंट","Refresh":"रिफ्रेश",
  "Approve":"स्वीकृत करें","Reject":"अस्वीकार करें","Assign":"नियुक्त करें","Verify":"सत्यापित करें",
  "Pending":"लंबित","Registered":"पंजीकृत","Assigned":"नियुक्त","In Transit":"मार्ग में","Arrived":"पहुँच गया",
  "Verified":"सत्यापित","Completed":"पूर्ण","Resolved":"हल हो गया","Critical":"गंभीर","High":"उच्च",
  "Medium":"मध्यम","Low":"निम्न","Active":"सक्रिय","Inactive":"निष्क्रिय","Total":"कुल",
  "Name":"नाम","Email":"ईमेल","Phone":"फ़ोन","Address":"पता","City":"शहर","State":"राज्य","Role":"भूमिका",
  "Vehicle":"वाहन","Driver":"चालक","Route":"मार्ग","Facility":"सुविधा","Category":"श्रेणी",
  "Today":"आज","This Week":"इस सप्ताह","This Month":"इस माह","No records found":"कोई रिकॉर्ड नहीं मिला",
  "Overview":"अवलोकन","Summary":"सारांश","Recent Activity":"हाल की गतिविधि","Reset View":"व्यू रीसेट करें",
  "Track":"ट्रैक करें","View Route":"मार्ग देखें","Route History":"मार्ग इतिहास"
};
var ATTRS = ['placeholder','title','aria-label','alt'];
var SKIP = {SCRIPT:1,STYLE:1,NOSCRIPT:1,SVG:1,CANVAS:1};

function translateTree(root, lang){
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode:function(n){
      if(!n.parentNode || SKIP[n.parentNode.nodeName]) return NodeFilter.FILTER_REJECT;
      return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  var nodes=[], n;
  while((n=w.nextNode())) nodes.push(n);
  nodes.forEach(function(node){
    if(node.__bsEn === undefined) node.__bsEn = node.nodeValue;
    var en = node.__bsEn, key = en.trim();
    if(lang === 'hi' && HI[key]){
      node.nodeValue = en.replace(key, HI[key]);
    } else {
      node.nodeValue = en;
    }
  });
  var all = root.querySelectorAll('*');
  Array.prototype.forEach.call(all, function(el){
    ATTRS.forEach(function(a){
      if(!el.hasAttribute(a)) return;
      var store = 'data-bs-en-' + a;
      if(!el.hasAttribute(store)) el.setAttribute(store, el.getAttribute(a));
      var en = el.getAttribute(store), key = en.trim();
      el.setAttribute(a, (lang === 'hi' && HI[key]) ? HI[key] : en);
    });
  });
}

var BSSettings = {
  theme: (function(){ try{ return localStorage.getItem('bs_theme') || 'light'; }catch(e){ return 'light'; } })(),
  lang: (function(){ try{ return localStorage.getItem('bs_lang') || 'en'; }catch(e){ return 'en'; } })(),
  open: false,
  anchor: null,

  applyTheme: function(){
    document.documentElement.classList.toggle('dark', this.theme === 'dark');
    var l=document.getElementById('bsThemeLight'), dk=document.getElementById('bsThemeDark');
    if(l) l.setAttribute('aria-checked', this.theme === 'light');
    if(dk) dk.setAttribute('aria-checked', this.theme === 'dark');
  },
  setTheme: function(t){
    this.theme = t;
    try{ localStorage.setItem('bs_theme', t); }catch(e){}
    this.applyTheme();
  },
  applyLang: function(){
    document.documentElement.setAttribute('lang', this.lang);
    translateTree(document.body, this.lang);
    var en=document.getElementById('bsLangEn'), hi=document.getElementById('bsLangHi');
    if(en) en.setAttribute('aria-checked', this.lang === 'en');
    if(hi) hi.setAttribute('aria-checked', this.lang === 'hi');
    if(window.lucide) lucide.createIcons();
  },
  setLang: function(l){
    this.lang = l;
    try{ localStorage.setItem('bs_lang', l); }catch(e){}
    this.applyLang();
  },
  position: function(){
    var p = document.getElementById('bsSetPanel');
    var a = this.anchor;
    if(!p || !a) return;
    var r = a.getBoundingClientRect();
    var w = 250;
    var left = Math.min(Math.max(8, r.right - w), window.innerWidth - w - 8);
    var top = r.bottom + 8;
    var maxTop = window.innerHeight - p.offsetHeight - 8;
    if(top > maxTop) top = Math.max(8, r.top - p.offsetHeight - 8);
    p.style.left = left + 'px';
    p.style.top = top + 'px';
  },
  toggle: function(btn, ev){
    if(ev) ev.stopPropagation();
    this.open ? this.close() : this.show(btn);
  },
  show: function(btn){
    var p = document.getElementById('bsSetPanel');
    this.anchor = btn || document.querySelector('.bs-set-trigger') || document.getElementById('bsSetBtnFloat');
    p.hidden = false;
    this.open = true;
    if(this.anchor) this.anchor.setAttribute('aria-expanded','true');
    this.applyTheme(); this.applyLang();
    this.position();
    var f = p.querySelector('[aria-checked="true"]') || p.querySelector('button');
    if(f) f.focus();
  },
  close: function(){
    var p = document.getElementById('bsSetPanel');
    if(p) p.hidden = true;
    this.open = false;
    document.querySelectorAll('.bs-set-trigger,#bsSetBtnFloat').forEach(function(b){ b.setAttribute('aria-expanded','false'); });
  },
  syncFloat: function(){
    var f = document.getElementById('bsSetBtnFloat');
    if(f) f.style.display = document.querySelector('.bs-set-trigger') ? 'none' : 'flex';
  }
};
window.BSSettings = BSSettings;

/* keep settings applied after every app re-render */
if(typeof window.render === 'function'){
  var _render = window.render;
  window.render = function(){
    var r = _render.apply(this, arguments);
    BSSettings.close();
    BSSettings.applyTheme();
    BSSettings.applyLang();
    BSSettings.syncFloat();
    return r;
  };
}

document.addEventListener('click', function(e){
  var p = document.getElementById('bsSetPanel');
  if(!BSSettings.open) return;
  if(p.contains(e.target)) return;
  if(e.target.closest && e.target.closest('.bs-set-trigger,#bsSetBtnFloat')) return;
  BSSettings.close();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && BSSettings.open){
    var a = BSSettings.anchor;
    BSSettings.close();
    if(a) a.focus();
  }
});
window.addEventListener('resize', function(){ if(BSSettings.open) BSSettings.position(); });
window.addEventListener('scroll', function(){ if(BSSettings.open) BSSettings.position(); }, true);

BSSettings.applyTheme();
BSSettings.applyLang();
BSSettings.syncFloat();
if(window.lucide) lucide.createIcons();
})();
</script>
